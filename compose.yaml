services:
  api:
    build: .
    env_file: .env
    environment:
      PORT: "${PORT:-3000}"
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - history:/srv/data
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["dev"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  history:
